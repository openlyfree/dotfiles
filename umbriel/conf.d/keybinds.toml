# Key bindings, grouped by purpose.

[keybinds]

# --- Apps ---------------------------------------------------------------
"Mod+Return" = { action = "spawn ghostty", repeat = true }
"Mod+Shift+B" = { action = "spawn helium-browser", repeat = false }
"Mod+Shift+F" = { action = "spawn strata", repeat = false }
"Mod+Shift+G" = { action = "spawn serein", repeat = false }
"Mod+Shift+Alt+G" = { action = "spawn helium-browser --app=https://web.whatsapp.com", repeat = false }
"Mod+Shift+Ctrl+G" = { action = "spawn helium-browser --app=https://gmail.google.com", repeat = false }
"Mod+Shift+XF86Assistant" = { action = "spawn grokbot", repeat = false }
"Mod+Shift+S" = { action = "spawn sonora", repeat = false }

# Noctalia panels
"Mod+Space" = { action = "spawn noctalia msg panel-toggle launcher", repeat = false }
"Mod+S" = { action = "spawn noctalia msg panel-toggle control-center", repeat = false }
"Mod+Ctrl+C" = { action = "spawn noctalia msg panel-toggle clipboard", repeat = false }
"Alt+Tab" = "spawn noctalia msg window-switcher"

# --- System, session, screenshots ---------------------------------------
"XF86PowerOff" = { action = "spawn noctalia msg panel-toggle session", repeat = false }
"XF86Presentation" = { action = "spawn noctalia msg power-cycle", repeat = false }
"Mod+Q" = { action = "window-close", repeat = true }
# Quits the session without confirmation.
"Mod+Shift+E" = { action = "session-quit skip-confirmation", repeat = false }
"Mod+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+Shift+P" = { action = "dpms-off", repeat = false }
"Mod+Ctrl+V" = { action = "spawn noctalia msg screenshot-region", repeat = false }
# Niri's screenshot-window has no Umbriel action. This captures the focused monitor.
"Alt+Insert" = { action = "spawn noctalia msg screenshot-fullscreen", repeat = true }

# --- Media and brightness -----------------------------------------------
# Volume and brightness go through Noctalia so the OSD shows. Media stays on playerctl.
"XF86AudioRaiseVolume" = { action = "spawn noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn playerctl play-pause", allow_when_locked = true, repeat = false }
"XF86AudioStop" = { action = "spawn playerctl stop", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn playerctl next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn playerctl previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn noctalia msg brightness-down", allow_when_locked = true }

# --- Focus and movement -------------------------------------------------
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-down"
"Mod+K" = "window-focus-up"
"Mod+L" = "window-focus-right"
"Mod+F1" = "window-focus-next"
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Right" = "column-move-right"
"Mod+Alt+Right" = "window-move-or-output-right"
"Mod+Alt+Left" = "window-move-or-output-left"

# --- Windows ------------------------------------------------------------
"Mod+P" = { action = "window-toggle-pinned", repeat = false }
"Mod+M" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+F" = "window-toggle-maximize"
"Mod+Alt+F" = "window-toggle-fullscreen"
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+Comma" = "window-consume-left"
"Mod+Period" = "window-consume-right"
"Mod+Ctrl+Comma" = "window-consume-from-left"
"Mod+Ctrl+Period" = "window-consume-from-right"

# Tabs and overview
# Needs layout.mode = "dwindle".
# "Mod+Alt+T" = "layout-toggle-split"
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }
"Mod+WheelUp" = "window-focus-left"
"Mod+WheelDown" = "window-focus-right"
"Mod+O" = { action = "overview-toggle", repeat = false }

# --- Workspaces ---------------------------------------------------------
"Mod+1" = "workspace-switch 1"
"Mod+2" = "workspace-switch 2"
"Mod+3" = "workspace-switch 3"
"Mod+4" = "workspace-switch 4"
"Mod+5" = "workspace-switch 5"
"Mod+6" = "workspace-switch 6"
"Mod+7" = "workspace-switch 7"
"Mod+8" = "workspace-switch 8"
"Mod+9" = "workspace-switch 9"
"Mod+Shift+1" = "window-move-to-workspace 1"
"Mod+Shift+2" = "window-move-to-workspace 2"
"Mod+Shift+3" = "window-move-to-workspace 3"
"Mod+Shift+4" = "window-move-to-workspace 4"
"Mod+Shift+5" = "window-move-to-workspace 5"
"Mod+Shift+6" = "window-move-to-workspace 6"
"Mod+Shift+7" = "window-move-to-workspace 7"
"Mod+Shift+8" = "window-move-to-workspace 8"
"Mod+Shift+9" = "window-move-to-workspace 9"
"Mod+Ctrl+Page_Down" = "column-move-to-workspace-next"
"Mod+Ctrl+Page_Up" = "column-move-to-workspace-previous"

# --- Scratchpad and column movement -------------------------------------
# Mod+Space is the launcher, so the toggle moved to Mod+Alt+Space.
"Mod+Shift+Space" = { action = "window-move-to-scratchpad", repeat = false }
"Mod+Alt+Space" = { action = "scratchpad-toggle", repeat = false }
"Mod+Ctrl+Space" = { action = "window-restore-from-scratchpad", repeat = false }
"Mod+Tab" = "scratchpad-focus-next"
"Mod+Ctrl+Home" = "column-move-left"
"Mod+Ctrl+End" = "column-move-right"
