[nightlight]
enabled = true

[notification]
background_opacity = 0.99999997764825821
position = "bottom_right"

[osd]
background_opacity = 0.99999997764825821
position = "bottom_center"
position_vertical = "bottom_center"

[plugin_settings."alexander/screen-toolkit"]
record-audio-out = true
record-codec = "hevc"
video-path = "/home/ethan/Videos/Screenshots"

[plugin_settings."noctalia/umbriel-companion"]
panel_placement = "floating"

[plugins]
enabled = [
    "noctalia/umbriel-companion",
    "alexander/screen-toolkit",
    "prponkshe/umbriel-displays",
    "elijaharch/wl-screen-mirror"
]

[shell]
card_borders = false
corner_radius_scale = 0.0
font_family = "Cascadia Code"
input_borders = false
lang = "en"
polkit_agent = true
popup_borders = false
popup_shadows = false
settings_window_translucent = false
umbriel_audio_provider_enabled = true

    [shell.launcher]
    compact = true
    layout = "simple"
    show_app_origin_indicator = false
    width = 620

        [shell.launcher.providers.emoji]
        global = false

        [shell.launcher.providers.panels]
        global = true

        [shell.launcher.providers.session]
        global = false

        [shell.launcher.providers.wallpaper]
        global = true

    [shell.panel]
    open_near_click_launcher = true
    session_placement = "floating"
    session_position = "center"
    shadow = false

    [shell.screen_corners]
    size = 100

    [shell.screenshot]
    directory = "/home/ethan/Pictures/Screenshots"
    show_cursor = true

    [shell.shadow]
    alpha = 0.0

    [shell.window_switcher]
    current_workspace_only = true
    style = "compact"

[system.monitor]
network_poll_seconds = 0

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Mocha Mauve-Lavender"
custom_palette = "wallpaper-1920x1200-ts"
pure_black_dark = false
source = "custom"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "ghostty", "helix", "kcolorscheme", "qt", "umbriel" ]
    community_ids = [
        "antigravity",
        "opencode",
        "pi-agent",
        "pywalfox",
        "gimp",
        "musescore",
        "obsidian",
        "zed",
        "pandora-launcher",
        "prismlauncher",
        "steam",
        "obs",
        "strata",
        "bat",
        "fzf",
        "herdr"
    ]

[wallpaper]
fill_mode = "stretch"
transition = [ "fade" ]

    [wallpaper.default]
    path = "/home/ethan/.config/noctalia/wallpapers/snow-leopard-mei-mei-wallpaper-v0-r7akxh2bcezh1.webp"

    [wallpaper.last]
    path = "/home/ethan/.config/noctalia/wallpapers/snow-leopard-mei-mei-wallpaper-v0-r7akxh2bcezh1.webp"

    [wallpaper.monitors.DP-1]
    path = "/home/ethan/Pictures/Wallpapers/snow-leopard-mei-mei-wallpaper-v0-r7akxh2bcezh1.webp"

    [wallpaper.monitors.eDP-1]
    path = "/home/ethan/.config/noctalia/wallpapers/snow-leopard-mei-mei-wallpaper-v0-r7akxh2bcezh1.webp"

[weather]
unit = "imperial"

[widget.clock]
capsule = false
format = "{:%I:%M %p, %B %d}"

[widget.control-center]
custom_image_colorize = true

[widget.cpu]
stat = "cpu_freq"

[widget.media]
art_size = 96
capsule = true
font_scale = 0.90000000000000013
hide_album_art = true
hide_artist = true
title_scroll = "always"

[widget.taskbar]
icon_scale = 1.2500000000000002
prefer_symbolic_icons = true
workspace_group_capsule = false

[widget.workspaces]
capsule_radius = 0
enabled = false