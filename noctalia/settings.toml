config_version = 20

[accessibility]
ui_scale = 0.95000000670552254

[audio]
enable_overdrive = true
enable_sounds = false

[backdrop]
enabled = true

[bar]
order = [ "default", "bar" ]

    [bar.bar]
    capsule = true
    capsule_opacity = 0.0
    capsule_padding = 4.0
    capsule_radius = 0
    capsule_thickness = 0.99999998137354851
    center = []
    end = [ "media", "tray", "notifications", "volume", "brightness", "battery", "control-center", "clock" ]
    margin_ends = 0
    padding = 6
    position = "bottom"
    radius = 0
    start = [ "launcher", "workspaces", "taskbar" ]
    thickness = 30

    [bar.default]
    background_opacity = 0.99999997764825821
    capsule_opacity = 0.0
    capsule_radius = 0
    compositor_blur = false
    enabled = false
    end = [ "tray", "notifications", "network", "bluetooth", "volume", "brightness", "battery", "control-center", "bar" ]
    panel_overlap = 0
    radius = 0
    shadow = false
    start = [ "clock", "group:g1", "media" ]
    thickness = 30

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_container"
        id = "g1"
        members = [ "cpu", "temp", "ram" ]
        opacity = 0.0
        padding = 6.0
        radius = 8.0

[battery]
warning_threshold = 20

[brightness]
enable_ddcutil = true
minimum_brightness = 0.0099999997764825821
sync_all_monitors = true

[calendar]
enabled = true
event_time_format = "{:%-I:%M %p}"

    [calendar.account.personal_google]
    type = "google"

[control_center]
show_shortcut_labels = false

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "alexander/screen-toolkit:toggle"

    [[control_center.shortcuts]]
    type = "caffeine"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
background_opacity = 0.99999997764825821
icon_size = 31
radius = 0
shadow = false
show_dots = true

[lockscreen]
blur_intensity = 0.99999997764825821
fingerprint = false
monitors = [ "eDP-1", "DP-1" ]
tint_intensity = 0.99999997764825821
transition = [ "fade" ]

